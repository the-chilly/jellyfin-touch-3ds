name: release

# Run this after creating a vX.Y.Z tag. Releases use a fixed updater asset name.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.4.2'
        required: true
        type: string

permissions:
  contents: write   # create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Install 3DS portlibs
        run: |
          apt-get update -qq && apt-get install -y -qq zip unzip qrencode
          dkp-pacman -S --noconfirm --needed \
            3ds-curl 3ds-mbedtls 3ds-zlib 3ds-mpg123 \
            3ds-libopus 3ds-opusfile 3ds-libvorbisidec 3ds-libogg

      # The workspace is checked out by the runner uid but make runs as the
      # container's root; without this, git describe fails (dubious
      # ownership) and the binary silently bakes version "unknown".
      - name: Trust workspace for git describe
        run: |
          command -v git >/dev/null || { apt-get update -qq || true; apt-get install -y -qq git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "version will be: $(git describe --tags --always --dirty)"
          git describe --tags --exact-match

      # Same cache key as build.yml — tag builds reuse the FFmpeg libs
      # already built on main (caches on the default branch are visible
      # to tag refs). Falls back to a full build on miss.
      - name: Cache FFmpeg static libs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            lib/ffmpeg/*.a
            lib/ffmpeg/include
          key: ffmpeg-3ds-${{ hashFiles('lib/ffmpeg/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash lib/ffmpeg/build-ffmpeg.sh

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: Build CIA and download QR
        run: |
          CIA_RELEASE_VERSION="${{ inputs.tag }}" bash ./build-cia.sh --container
          qrencode -l M -s 8 -m 4 -o jellyfin-3ds-install-qr.png "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/jellyfin-3ds.cia"

      # No version sanity check needed anymore: JFIN_VERSION is derived
      # from git describe at build time, so a tag build bakes the tag.

      - name: Stage SD package
        run: |
          mkdir -p dist/3ds/jellyfin-3ds
          cp jellyfin-3ds.3dsx jellyfin-3ds.smdh cacert.pem dist/3ds/jellyfin-3ds/
          cp LICENSE dist/
          cp RELEASE-INSTALL.txt dist/INSTALL.txt
          cd dist && zip -r ../jellyfin-touch-3ds-sd.zip .

      - name: Create release with asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            jellyfin-3ds.3dsx
            jellyfin-3ds.cia
            jellyfin-3ds-install-qr.png
            jellyfin-touch-3ds-sd.zip
          generate_release_notes: true
